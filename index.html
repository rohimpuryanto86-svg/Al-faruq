// ======================== CACHE SYSTEM (IndexedDB) ========================
const CACHE_VERSION = 'aoc_v1';
const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000; // 7 hari

const CacheDB = {
    db: null,
    async init() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('AOC_Cache', 1);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('cache')) {
                    db.createObjectStore('cache', { keyPath: 'key' });
                }
            };
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
            req.onerror = () => reject(req.error);
        });
    },
    async set(key, value) {
        if (!this.db) return;
        return new Promise((resolve) => {
            const tx = this.db.transaction('cache', 'readwrite');
            tx.objectStore('cache').put({ key, value, timestamp: Date.now() });
            tx.oncomplete = resolve;
            tx.onerror = resolve; // jangan block kalau gagal
        });
    },
    async get(key) {
        if (!this.db) return null;
        return new Promise((resolve) => {
            const tx = this.db.transaction('cache', 'readonly');
            const req = tx.objectStore('cache').get(key);
            req.onsuccess = () => {
                const result = req.result;
                if (!result) return resolve(null);
                // Cek expired
                if (Date.now() - result.timestamp > CACHE_DURATION) {
                    this.delete(key);
                    return resolve(null);
                }
                resolve(result.value);
            };
            req.onerror = () => resolve(null);
        });
    },
    async delete(key) {
        if (!this.db) return;
        return new Promise((resolve) => {
            const tx = this.db.transaction('cache', 'readwrite');
            tx.objectStore('cache').delete(key);
            tx.oncomplete = resolve;
        });
    },
    async clear() {
        if (!this.db) return;
        return new Promise((resolve) => {
            const tx = this.db.transaction('cache', 'readwrite');
            tx.objectStore('cache').clear();
            tx.oncomplete = resolve;
        });
    }
};

                // Cari produk yang cocok berdasarkan sku (ambil bagian terakhir sebagai sku)
                // sku bisa mengandung underscore jadi kita cari by sku di semua kategori
                const savedMarkup = parseInt(s.value);
                if (!isNaN(savedMarkup)) {
                    for (const [cat, products] of Object.entries(PPOB_PRODUCTS)) {
                        for (const p of products) {
                            if (s.key === `ppob_markup_${cat}_${p.sku}`) {
                                p.markup = savedMarkup;
                            }
                        }
                    }
                }
            }
            // Pengaturan sertifikat disimpan langsung di appSettings object
        });
    }
}

// Semua harga dihitung di server (Edge Function "midtrans-pay"). Browser hanya
// meminta order, menampilkan QR, lalu memantau status sampai lunas.
let activePay = null; // { orderId, timer, tick, done }

const ORDER_STATUS_LABEL = { pending: '⏳ Menunggu bayar', paid: '✅ Lunas', expired: '⌛ Kedaluwarsa', failed: '❌ Gagal' };

async function startCheckout(payload, onPaid) {
    try {
        const { data, error } = await supabaseClient.functions.invoke("midtrans-pay", { body: { action: "create", ...payload } });
        if (error) {
            let msg = error.message;
            try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch (_) {}
            throw new Error(msg);
        }
        if (data?.error) throw new Error(data.error);
        showQrisModal({
            order_id: data.order_id, item_name: data.item_name, gross_amount: data.gross_amount,
            qr_string: data.qr_string, qr_url: data.qr_url, expires_at: data.expires_at
        }, onPaid);
    } catch (e) {
        alert("❌ " + e.message);
    }
}

function closePayModal() {
    if (activePay) { clearInterval(activePay.timer); clearInterval(activePay.tick); activePay = null; }
    const m = document.getElementById("payModal");
    if (m) m.remove();
}
window.closePayModal = closePayModal;

function showQrisModal(order, onPaid) {
    closePayModal();
    document.body.insertAdjacentHTML('beforeend', `
        <div class="modal" id="payModal" style="display:flex;">
            <div class="modal-content" style="text-align:center;">
                <span class="modal-close" onclick="closePayModal()">&times;</span>
                <h3>Bayar dengan QRIS</h3>
                <p style="margin:6px 0;">${escapeHtml(order.item_name)}</p>
                <div style="font-size:1.6rem; font-weight:bold; color:#27ae60; margin:6px 0;">${formatRupiah(order.gross_amount)}</div>
                <div id="payQrBox" style="background:white; display:inline-block; padding:12px; border-radius:12px; min-height:200px; min-width:200px;"></div>
                <p style="font-size:0.85rem; margin-top:10px;">Buka aplikasi e-wallet / m-banking apa saja yang mendukung QRIS, lalu scan kode di atas.</p>
                <div id="payCountdown" style="font-weight:bold; margin:8px 0;"></div>
                <div id="payStatus" class="alert alert-info">⏳ Menunggu pembayaran...</div>
                <button class="btn-back" onclick="closePayModal()">Tutup</button>
                <p style="font-size:0.75rem; opacity:0.7;">Jika Anda sudah membayar, jangan tutup halaman — status otomatis diperbarui. Riwayat bisa dilihat di menu Riwayat Bayar.</p>
            </div>
        </div>`);

    // Render QR dari qr_string; fallback ke gambar dari Midtrans
    const box = document.getElementById("payQrBox");
    let rendered = false;
    if (order.qr_string && typeof QRCode !== 'undefined') {
        try { new QRCode(box, { text: order.qr_string, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); rendered = true; } catch (_) {}
    }
    if (!rendered && order.qr_url) box.innerHTML = `<img src="${order.qr_url}" style="width:200px;height:200px;" alt="QRIS">`;

    activePay = { orderId: order.order_id, timer: null, tick: null, polls: 0 };
    const exp = new Date(order.expires_at).getTime();
    const cd = document.getElementById("payCountdown");
    const updateCd = () => {
        const left = Math.max(0, Math.floor((exp - Date.now()) / 1000));
        if (cd) cd.textContent = left > 0 ? `Berlaku ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : "QR kedaluwarsa";
    };
    updateCd();
    activePay.tick = setInterval(updateCd, 1000);

    const setStatus = (cls, html) => { const el = document.getElementById("payStatus"); if (el) { el.className = "alert alert-" + cls; el.innerHTML = html; } };

    const poll = async () => {
        if (!activePay || activePay.orderId !== order.order_id) return;
        activePay.polls++;
        let status = null, providerStatus = null;
        // Setiap 3x polling, minta server cek ke Midtrans (cadangan bila webhook terlambat)
        if (activePay.polls % 3 === 0) {
            try {
                const { data } = await supabaseClient.functions.invoke("midtrans-pay", { body: { action: "status", order_id: order.order_id } });
                status = data?.status; providerStatus = data?.provider_status;
            } catch (_) {}
        }
        if (!status) {
            const { data } = await supabaseClient.from('orders').select('status, provider_status').eq('order_id', order.order_id).single();
            status = data?.status; providerStatus = data?.provider_status;
        }
        if (!activePay) return;
        if (status === 'paid') {
            clearInterval(activePay.timer); clearInterval(activePay.tick);
            await loadUserProfile(true);
            if (providerStatus === 'failed') setStatus('warning', '✅ Pembayaran diterima, tetapi pengiriman produk gagal. Admin akan memproses pengembalian dana / pengiriman ulang. Hubungi admin dengan menyebut nomor order.<br><small>' + escapeHtml(order.order_id) + '</small>');
            else setStatus('success', '✅ Pembayaran berhasil!');
            setTimeout(() => { closePayModal(); if (onPaid) onPaid(); }, 2200);
        } else if (status === 'expired' || status === 'failed') {
            clearInterval(activePay.timer);
            setStatus('danger', status === 'expired' ? '⌛ QR kedaluwarsa. Silakan buat pesanan baru.' : '❌ Pembayaran gagal / dibatalkan.');
        }
    };
    activePay.timer = setInterval(poll, 4000);
}

async function checkAndUpdateReferralStatus() {
    let canRefer = false;
    const { data: allScores } = await supabaseClient
        .from('scores').select('*').eq('user_id', currentUser.id);
    currentUser.scores = allScores || [];
    for (const course of coursesData) {
        if (isCourseOwned(course.id)) {
            let completed = currentUser.completedLessons[course.id] || [];
            let totalLessons = (course.lessons || []).length;
            if (completed.length === totalLessons && totalLessons > 0) {
                let courseScores = currentUser.scores.filter(s => s.course_id === course.id);
                let avgScore = courseScores.length > 0
                    ? courseScores.reduce((sum, s) => sum + (s.quiz_score || 0), 0) / courseScores.length
                    : 0;
                if (avgScore >= 70) { canRefer = true; break; }
            }
        }
    }
    if (currentUser.canRefer !== canRefer) {
        await supabaseClient.from('profiles').update({ can_refer: canRefer }).eq('user_id', currentUser.id);
        currentUser.canRefer = canRefer;
    }
    return canRefer;
}

async function checkAndAwardBadges() {
    // Always recalculate from scratch — never trust cached DB badges
    // This ensures wrongly awarded badges (e.g. Master from old bug) get corrected
    let previousEarned = currentUser.earnedBadges ? [...currentUser.earnedBadges] : [];
    let correctEarned = [];

    let totalCompleted = 0;
    let ownedCourses = coursesData.filter(c => isCourseOwned(c.id));
    let completedCourses = 0;

    for (const course of ownedCourses) {
        let completed = currentUser.completedLessons[course.id] || [];
        let totalLessons = (course.lessons || []).length;
        totalCompleted += completed.length;
        if (totalLessons > 0 && completed.length === totalLessons) completedCourses++;
    }

    // Master requires ALL owned courses completed AND must own more than 1
    let allCoursesCompleted = completedCourses === ownedCourses.length && ownedCourses.length > 1;

    for (const badge of badgesData) {
        let shouldEarn = false;
        let req = (badge.requirement || '').toLowerCase();
        let name = (badge.name || '').toLowerCase();
        if (badge.id === 1 || name === 'pemula' || req.includes('1 materi')) {
            shouldEarn = totalCompleted >= 1;
        } else if (badge.id === 2 || name === 'semangat' || req.includes('5 materi')) {
            shouldEarn = totalCompleted >= 5;
        } else if (badge.id === 3 || name === 'sarjana' || req.includes('1 kursus')) {
            shouldEarn = completedCourses >= 1;
        } else if (badge.id === 4 || name === 'master' || req.includes('semua kursus')) {
            shouldEarn = allCoursesCompleted;
        }
        if (shouldEarn) correctEarned.push(badge.id);
    }

    // Find newly earned badges (not in previous list)
    let newBadges = badgesData.filter(b => correctEarned.includes(b.id) && !previousEarned.includes(b.id));

    // Always save the corrected list back to DB (fixes wrongly awarded badges)
    if (JSON.stringify(correctEarned.sort()) !== JSON.stringify(previousEarned.sort())) {
        currentUser.earnedBadges = correctEarned;
        await supabaseClient.from('profiles').update({ earned_badges: correctEarned }).eq('user_id', currentUser.id);
    }

    if (newBadges.length > 0) {
        let badgeNames = newBadges.map(b => `${b.icon || '🏅'} ${b.name}`).join(', ');
        alert(`🎉 Selamat! Kamu mendapat badge baru: ${badgeNames}`);
    }
    return newBadges;
}

function getCourseProgress(courseId) {
    let completed = currentUser.completedLessons[courseId] || [];
    let total = coursesData.find(c => c.id === courseId)?.lessons?.length || 1;
    return { completed: completed.length, total, percent: (completed.length / total) * 100 };
}

function getOverallProgress() {
    let totalCompleted = 0, totalLessons = 0;
    coursesData.forEach(course => {
        if (isCourseOwned(course.id)) {
            let completed = currentUser.completedLessons[course.id] || [];
            totalCompleted += completed.length;
            totalLessons += (course.lessons || []).length;
        }
    });
    return { completed: totalCompleted, total: totalLessons, percent: totalLessons > 0 ? (totalCompleted / totalLessons) * 100 : 0 };
}

function updateLandingCountdown() {
    let el = document.getElementById("landingCountdown");
    if (!el) return;
    if (settings.earlyBirdEnabled && new Date() < new Date(settings.earlyBirdEndDate)) {
        let diff = new Date(settings.earlyBirdEndDate) - new Date();
        if (diff > 0) {
            let d = Math.floor(diff / 86400000);
            let h = Math.floor((diff % 86400000) / 3600000);
            let m = Math.floor((diff % 3600000) / 60000);
            let s = Math.floor((diff % 60000) / 1000);
            el.innerHTML = `Diskon ${settings.earlyBirdDiscount}% berlaku ${d}d ${h}h ${m}m ${s}s lagi!`;
            return;
        }
    }
    el.innerHTML = "Early Bird berakhir! Cek harga normal.";
}

function copyReferral() {
    const referralCode = currentUser && currentUser.referralCode;
    if (!referralCode) {
        alert("Kode referral tidak ditemukan!");
        return;
    }
    const baseUrl = window.location.href.split('?')[0].split('#')[0];
    // Format: base?ref=CODE#register → sehingga saat hash berubah ke #register, URL search masih ada
    const referralUrl = `${baseUrl}?ref=${referralCode}#register`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(referralUrl).then(() => {
            alert(`✅ Link referral berhasil disalin!\n\n${referralUrl}\n\nBagikan link ini kepada teman Anda.`);
        }).catch(() => {
            fallbackCopy(referralUrl);
        });
    } else {
        fallbackCopy(referralUrl);
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try {
        document.execCommand('copy');
        alert(`✅ Link referral berhasil disalin!\n\n${text}`);
    } catch(e) {
        alert(`Gagal menyalin otomatis. Salin manual:\n\n${text}`);
    }
    document.body.removeChild(textarea);
}

window.copyReferral = copyReferral;

            const priceEl = document.getElementById(`price-${c.id}`);
            if (priceEl) {
                priceEl.innerHTML = `<span style="text-decoration:line-through; color:#999;">${formatRupiah(originalPrice)}</span> → ${formatRupiah(discountedPrice)}`;
            }
            const buyBtn = document.querySelector(`.buy-course[data-id="${c.id}"]`);
            if (buyBtn) {
                buyBtn.setAttribute("data-price", discountedPrice);
                buyBtn.innerHTML = `Beli (${formatRupiah(discountedPrice)})`;
            }
        });
        
        // Update bundle price
        const settingPrice = parseInt(appSettings['bundle_price'] || 800000);
        const bundlePrice = getDiscountedPrice(settingPrice);
        const discountedBundlePrice = Math.round(bundlePrice * (1 - discountPercent / 100));
        const bundleBtn = document.getElementById("buyBundleBtn");
        if (bundleBtn && !currentUser.isBundle) {
            bundleBtn.innerHTML = `🛒 Beli Bundle Sekarang (${formatRupiah(discountedBundlePrice)})`;
            bundleBtn.setAttribute("data-price", discountedBundlePrice);
        }
    }
    
    function resetPrices() {
        coursesData.forEach(c => {
            const originalPrice = getDiscountedPrice(c.price);
            const priceEl = document.getElementById(`price-${c.id}`);
            if (priceEl) {
                priceEl.innerHTML = formatRupiah(originalPrice);
            }
            const buyBtn = document.querySelector(`.buy-course[data-id="${c.id}"]`);
            if (buyBtn) {
                buyBtn.setAttribute("data-price", originalPrice);
                buyBtn.innerHTML = `Beli (${formatRupiah(originalPrice)})`;
            }
        });
        
        const settingPrice2 = parseInt(appSettings['bundle_price'] || 800000);
        const bundlePrice = getDiscountedPrice(settingPrice2);
        const bundleBtn = document.getElementById("buyBundleBtn");
        if (bundleBtn && !currentUser.isBundle) {
            bundleBtn.innerHTML = `🛒 Beli Bundle Sekarang (${formatRupiah(bundlePrice)})`;
            bundleBtn.setAttribute("data-price", bundlePrice);
        }
    }
    
    // Event listener tombol terapkan promo
    document.getElementById("applyPromoBtn").onclick = async () => {
        const code = document.getElementById("promoCodeInput").value.trim();
        if (!code) {
            alert("Masukkan kode promo!");
            return;
        }
        
        const result = await checkPromo(code);
        const promoMessage = document.getElementById("promoMessage");
        
        if (result.valid) {
            appliedPromo = result;
            promoMessage.innerHTML = `<div class="alert-success">✅ ${result.message}</div>`;
            updatePricesWithDiscount(result.discount);
        } else {
            appliedPromo = null;
            promoMessage.innerHTML = `<div class="alert-warning">❌ ${result.message}</div>`;
        }
    };
    
    // Event listener tombol batal promo
    document.getElementById("clearPromoBtn").onclick = () => {
        appliedPromo = null;
        document.getElementById("promoCodeInput").value = "";
        document.getElementById("promoMessage").innerHTML = "";
        resetPrices();
        alert("🏷️ Kode promo dibatalkan");
    };

    // Bundle buy (dengan promo jika ada)
    if (document.getElementById("buyBundleBtn")) {
        document.getElementById("buyBundleBtn").onclick = async () => {
            const promoDiscount = appliedPromo ? appliedPromo.discount : 0;
            await purchaseBundle(promoDiscount, appliedPromo?.code);
        };
    }
}

function getEmbedUrl(url) {
    if (!url) return null;
    url = url.trim();
    let ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}?rel=0`;
    let driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
    if (url.startsWith('http')) return url;
    return null;
}

function renderQuizPage() {
    let lesson = currentCourseForUser.lessons[selectedLessonIndex];
    let quiz = lesson.quiz;
    if (!quiz || !Array.isArray(quiz) || quiz.length === 0) { alert("Belum ada quiz untuk materi ini."); renderLessonDetail(); return; }
    let validQuiz = quiz.filter(q => q.q && Array.isArray(q.opt) && q.opt.length >= 2 && typeof q.jawab === 'number');
    if (validQuiz.length === 0) { alert("Format quiz tidak valid. Hubungi admin."); renderLessonDetail(); return; }
    let existing = localStorage.getItem(`quiz_${currentUser.id}_${currentCourseForUser.id}_${selectedLessonIndex}`);
    if (existing) { alert(`Anda sudah mengerjakan quiz ini dengan nilai: ${parseInt(existing) * 10}/100`); renderLessonDetail(); return; }
    let html = `<div class="tabs"><div class="tab" id="backToLesson">Kembali ke Materi</div><div class="tab active">📝 Quiz: ${escapeHtml(lesson.title)}</div></div>
        <div class="card"><div class="alert-info">📋 Jawab semua soal berikut. Nilai minimal kelulusan: <strong>70/100</strong></div>
        <form id="quizForm">${validQuiz.map((q, idx) => `<div class="form-group" style="background:var(--bg-lesson); border-radius:16px; padding:15px; margin-bottom:12px;"><label style="font-weight:bold;">${idx+1}. ${escapeHtml(q.q)}</label>
        <div style="display:flex; flex-direction:column; gap:8px;">${q.opt.map((o, oi) => `<label style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; border:1px solid var(--border-color);"><input type="radio" name="q${idx}" value="${oi}" required> <span>${escapeHtml(o)}</span></label>`).join('')}</div></div>`).join('')}
        <button type="submit" class="btn-success">Kirim Jawaban</button></form><div id="quizResult"></div></div>`;
    document.getElementById("appRoot").innerHTML = html;
    document.getElementById("backToLesson").onclick = () => renderLessonDetail();
    document.getElementById("quizForm").onsubmit = async (e) => {
        e.preventDefault();
        let score = 0;
        validQuiz.forEach((q, idx) => { let sel = document.querySelector(`input[name="q${idx}"]:checked`); if (sel && parseInt(sel.value) === q.jawab) score++; });
        const { error } = await supabaseClient.from('scores').upsert({ user_id: currentUser.id, course_id: currentCourseForUser.id, lesson_id: selectedLessonIndex, quiz_score: score * 10, taken_at: new Date().toISOString() }, { onConflict: 'user_id, course_id, lesson_id' });
        if (error) { console.error("Error saving score:", error); alert("Gagal menyimpan nilai!\n\nDetail: " + (error.message || error.details || JSON.stringify(error))); return; }
        if (score >= 7) {
            let completed = currentUser.completedLessons[currentCourseForUser.id] || [];
            if (!completed.includes(selectedLessonIndex)) { completed.push(selectedLessonIndex); currentUser.completedLessons[currentCourseForUser.id] = completed;
            await supabaseClient.from('user_progress').upsert({ user_id: currentUser.id, course_id: currentCourseForUser.id, completed_lessons: completed }, { onConflict: 'user_id, course_id' }); }
            await checkAndUpdateReferralStatus();
            await checkAndUpdateReferralStatus();
            await checkAndUpdateReferralStatus();
            await checkAndAwardBadges();
            document.getElementById("quizResult").innerHTML = `<div class="alert-success">✅ Lulus! Nilai: ${score * 10}/100</div>`;
            setTimeout(() => { renderLearningView(); }, 2000);
        } else { document.getElementById("quizResult").innerHTML = `<div class="alert-danger">❌ Belum lulus. Nilai: ${score * 10}/100. Minimal 70.</div>`; }
    };
}

async function loadPPOBProducts(category) {
    const container = document.getElementById("ppobProductsContainer");
    if (!container) return;

    // Limit harian e-wallet dihitung dari order yang sudah dibayar hari ini
    const ewalletLimit = 500000;
    let todayEwalletTotal = 0;
    if (category === "ewallet") {
        const start = new Date(); start.setHours(0, 0, 0, 0);
        const { data: todayOrders } = await supabaseClient.from('orders').select('gross_amount')
            .eq('user_id', currentUser.id).eq('kind', 'ppob').eq('category', 'ewallet')
            .eq('status', 'paid').gte('created_at', start.toISOString());
        todayEwalletTotal = (todayOrders || []).reduce((s, t) => s + t.gross_amount, 0);
    }

    const products = PPOB_PRODUCTS[category] || [];
    if (products.length === 0) { container.innerHTML = '<div class="alert-warning">Belum ada produk untuk kategori ini</div>'; return; }

    let productsHtml = `<div class="course-grid">`;
    for (const product of products) {
        const price = getPPOBPrice(product.basePrice, product.markup);
        const remaining = ewalletLimit - todayEwalletTotal;
        const isDisabled = category === "ewallet" && remaining < price;
        productsHtml += `
            <div class="course-card ppob-product-card">
                <div class="course-icon">${getProductIconPPOB(category)}</div>
                <div class="course-title">${product.name}</div>
                <div class="course-price">${formatRupiah(price)}</div>
                ${category === "ewallet" ? `<div class="alert-info" style="font-size:0.7rem;">💰 Sisa limit harian: ${formatRupiah(Math.max(0, remaining))}</div>` : ''}
                <button class="btn-primary select-ppob-product" data-sku="${product.sku}" data-name="${product.name}" data-price="${price}" data-category="${category}" ${isDisabled ? 'disabled' : ''}>
                    ${isDisabled ? 'Limit Habis' : 'Beli'}
                </button>
            </div>`;
    }
    productsHtml += `</div>`;
    container.innerHTML = productsHtml;

    document.querySelectorAll(".select-ppob-product").forEach(btn => {
        btn.onclick = () => {
            const name = btn.getAttribute("data-name"), price = parseInt(btn.getAttribute("data-price"));
            selectedPPOBProduct = { sku: btn.getAttribute("data-sku"), name, price, category: btn.getAttribute("data-category") };
            document.getElementById("selectedProductName").innerHTML = `Beli: ${escapeHtml(name)} - ${formatRupiah(price)}`;
            document.getElementById("productPrice").value = formatRupiah(price);
            document.getElementById("purchaseFormContainer").style.display = "block";
            document.getElementById("customerId").focus();
        };
    });
}

            try {

                const { data: scores } = await supabaseClient
                    .from('scores')
                    .select('quiz_score')
                    .eq('user_id', currentUser.id)
                    .eq('course_id', course.id);

                let finalScore = 0;
                if (scores && scores.length > 0) {
                    const total = scores.reduce((sum, s) => sum + (s.quiz_score || 0), 0);
                    finalScore = Math.round(total / scores.length);
                }

                const predikat = finalScore >= 90 ? 'SANGAT MEMUASKAN'
                    : finalScore >= 75 ? 'MEMUASKAN'
                    : finalScore >= 60 ? 'CUKUP MEMUASKAN'
                    : 'LULUS';

                const certId = currentUser.id.substring(0, 8).toUpperCase() + '-' + course.id + '-' + Date.now();
                const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                // Save certificate record to DB (upsert so re-downloads keep same number)
                let certNumber = certId;
                try {
                    // Check if cert already exists for this user+course
                    const { data: existingCert } = await supabaseClient
                        .from('certificates')
                        .select('cert_number')
                        .eq('user_id', currentUser.id)
                        .eq('course_id', course.id)
                        .single();
                    if (existingCert && existingCert.cert_number) {
                        certNumber = existingCert.cert_number;
                    } else {
                        await supabaseClient.from('certificates').upsert({
                            user_id: currentUser.id,
                            user_name: currentUser.name,
                            course_id: course.id,
                            course_title: course.title,
                            cert_number: certNumber,
                            final_score: finalScore,
                            issued_at: new Date().toISOString()
                        }, { onConflict: 'user_id,course_id' });
                    }
                } catch(dbErr) { console.warn('Cert DB save:', dbErr); }

                // Generate QR code as data URL
                const qrVerifyUrl = `${window.location.origin}${window.location.pathname}?verify=${certNumber}`;
                const qrDataUrl = await new Promise((resolve, reject) => {
                    const qrDiv = document.createElement('div');
                    qrDiv.style.display = 'none';
                    document.body.appendChild(qrDiv);
                    try {
                        const qr = new QRCode(qrDiv, {
                            text: qrVerifyUrl,
                            width: 128,
                            height: 128,
                            correctLevel: QRCode.CorrectLevel.M
                        });
                        setTimeout(() => {
                            const canvas = qrDiv.querySelector('canvas');
                            const img = qrDiv.querySelector('img');
                            let dataUrl = '';
                            if (canvas) dataUrl = canvas.toDataURL('image/png');
                            else if (img) dataUrl = img.src;
                            document.body.removeChild(qrDiv);
                            resolve(dataUrl);
                        }, 300);
                    } catch(e) { document.body.removeChild(qrDiv); reject(e); }
                });

                // Build certificate using jsPDF in landscape A4
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });

                const W = doc.internal.pageSize.getWidth();   // 297mm
                const H = doc.internal.pageSize.getHeight();  // 210mm
                const cx = W / 2;

                const green  = [30, 107, 59];
                const orange = [230, 126, 34];
                const dark   = [44, 62, 80];
                const gold   = [244, 162, 97];

                // Outer border (gold)
                doc.setDrawColor(...gold);
                doc.setLineWidth(4);
                doc.rect(8, 8, W - 16, H - 16);

                // Inner border (green thin)
                doc.setDrawColor(...green);
                doc.setLineWidth(1);
                doc.rect(12, 12, W - 24, H - 24);

                // Green header band
                doc.setFillColor(...green);
                doc.rect(12, 12, W - 24, 28, 'F');

                // Header text: ALFARUQ ONLINE COURSE
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(22);
                doc.setTextColor(255, 255, 255);
                doc.text('ALFARUQ ONLINE COURSE', cx, 24, { align: 'center' });

                doc.setFontSize(11);
                doc.setFont('helvetica', 'normal');
                doc.text('Lembaga Pendidikan Islam Terpercaya', cx, 33, { align: 'center' });

                // SERTIFIKAT title
                doc.setFontSize(36);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(...green);
                doc.text('SERTIFIKAT', cx, 62, { align: 'center' });

                doc.setFontSize(14);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(100, 100, 100);
                doc.text('KELULUSAN', cx, 72, { align: 'center' });

                // Divider line
                doc.setDrawColor(...gold);
                doc.setLineWidth(0.8);
                doc.line(40, 77, W - 40, 77);

                // "Diberikan kepada"
                doc.setFontSize(11);
                doc.setTextColor(100, 100, 100);
                doc.setFont('helvetica', 'italic');
                doc.text('Diberikan kepada', cx, 87, { align: 'center' });

                // Recipient name
                doc.setFontSize(28);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(...dark);
                doc.text(currentUser.name || '-', cx, 102, { align: 'center' });

                // Name underline
                doc.setDrawColor(...dark);
                doc.setLineWidth(0.5);
                const nameW = doc.getTextWidth(currentUser.name || '-');
                doc.line(cx - nameW/2, 105, cx + nameW/2, 105);

                // "Atas keberhasilannya menyelesaikan"
                doc.setFontSize(11);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(80, 80, 80);
                doc.text('Atas keberhasilannya menyelesaikan program kursus', cx, 115, { align: 'center' });

                // Course name
                doc.setFontSize(18);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(...orange);
                doc.text(course.title, cx, 126, { align: 'center' });

                // Predikat & score
                doc.setFontSize(12);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(80, 80, 80);
                doc.text('dengan predikat', cx, 136, { align: 'center' });

                doc.setFontSize(16);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(...green);
                doc.text(predikat, cx, 145, { align: 'center' });

                doc.setFontSize(11);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(80, 80, 80);
                doc.text('Nilai Akhir: ' + finalScore + ' / 100', cx, 153, { align: 'center' });

                // Gold divider
                doc.setDrawColor(...gold);
                doc.setLineWidth(0.8);
                doc.line(40, 158, W - 40, 158);

                // ── FOOTER LAYOUT (landscape A4: W=297mm, H=210mm) ──────────────
                // Zona aman: y=160 s/d y=200 (40mm)
                // Struktur: [QR kiri] [TandaTangan Kiri] [Tanggal] [TandaTangan Kanan]
                // Tidak ada QR kanan — hanya 1 QR untuk verifikasi

                // Helper: normalisasi gambar agar tidak terbalik di jsPDF
                // jsPDF kadang membalik gambar PNG — solusi: render ulang via canvas
                async function normalizeImageForPDF(dataUrl, targetW, targetH) {
                    return new Promise((res) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            // Resolusi 3x untuk kualitas tanda tangan
                            canvas.width  = targetW * 3;
                            canvas.height = targetH * 3;
                            const ctx = canvas.getContext('2d');
                            // Pastikan background transparan / putih
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            // Gambar normal (tidak di-flip)
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            res(canvas.toDataURL('image/png'));
                        };
                        img.onerror = () => res(dataUrl); // fallback ke original
                        img.src = dataUrl;
                    });
                }

                // Koordinat footer
                const qrSize   = 26;    // ukuran QR mm
                const qrX      = 16;    // QR: pojok kiri
                const qrY      = 162;   // QR: pojok atas

                const sig1x    = 95;          // kolom tanda tangan kiri
                const sig2x    = W - 95;      // kolom tanda tangan kanan
                const sigImgW  = 46;          // lebar gambar tanda tangan mm
                const sigImgH  = 14;          // tinggi gambar tanda tangan mm
                const sigLineY = 183;          // y garis tanda tangan
                const sigImgY  = sigLineY - sigImgH - 1;  // gambar di atas garis
                const sigNameY = sigLineY + 5; // y nama
                const sigRoleY = sigNameY + 4; // y jabatan

                // Ambil nama & tanda tangan dari settings
                // Prioritas: pengajar per-kursus → pengajar global
                const certTeacherName = (course.teacher_name && course.teacher_name.trim())
                    ? course.teacher_name
                    : (appSettings['cert_teacher_name'] || 'Ustadz Pengajar');
                const certDirectorName = appSettings['cert_director_name'] || 'Direktur';
                const certTeacherSig = (course.teacher_signature && course.teacher_signature.startsWith('data:'))
                    ? course.teacher_signature
                    : (appSettings['cert_teacher_signature'] || '');
                const certDirectorSig = appSettings['cert_director_signature'] || '';

                // Normalisasi & gambar tanda tangan kiri (Pengajar)
                if (certTeacherSig && certTeacherSig.startsWith('data:')) {
                    try {
                        const fixedSig = await normalizeImageForPDF(certTeacherSig, sigImgW * 4, sigImgH * 4);
                        doc.addImage(fixedSig, 'PNG',
                            sig1x - sigImgW / 2, sigImgY,
                            sigImgW, sigImgH, undefined, 'NONE');
                    } catch(e) { console.warn('Sig teacher error:', e); }
                }

                // Normalisasi & gambar tanda tangan kanan (Direktur)
                if (certDirectorSig && certDirectorSig.startsWith('data:')) {
                    try {
                        const fixedSig2 = await normalizeImageForPDF(certDirectorSig, sigImgW * 4, sigImgH * 4);
                        doc.addImage(fixedSig2, 'PNG',
                            sig2x - sigImgW / 2, sigImgY,
                            sigImgW, sigImgH, undefined, 'NONE');
                    } catch(e) { console.warn('Sig director error:', e); }
                }

                // Garis tanda tangan
                doc.setDrawColor(...dark);
                doc.setLineWidth(0.5);
                doc.line(sig1x - 28, sigLineY, sig1x + 28, sigLineY);
                doc.line(sig2x - 28, sigLineY, sig2x + 28, sigLineY);

                // Nama pengajar & direktur
                doc.setFontSize(10);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(...dark);
                doc.text(certTeacherName, sig1x, sigNameY, { align: 'center' });
                doc.text(certDirectorName, sig2x, sigNameY, { align: 'center' });

                // Label jabatan
                doc.setFontSize(8);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(100, 100, 100);
                doc.text('Pengajar', sig1x, sigRoleY, { align: 'center' });
                doc.text('Direktur', sig2x, sigRoleY, { align: 'center' });

                // Tanggal — tengah, sejajar garis tanda tangan
                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(100, 100, 100);
                doc.text(dateStr, cx, sigLineY - 3, { align: 'center' });

                // QR verifikasi — pojok kiri, tidak tindih tanda tangan
                try {
                    if (qrDataUrl && qrDataUrl.startsWith('data:')) {
                        doc.addImage(qrDataUrl, 'PNG', qrX, qrY, qrSize, qrSize);
                        doc.setFontSize(6);
                        doc.setTextColor(150, 150, 150);
                        doc.text('Scan untuk verifikasi', qrX + qrSize / 2, qrY + qrSize + 3, { align: 'center' });
                    }
                } catch(qrErr) { console.warn('QR error:', qrErr); }

                // Nomor sertifikat — bawah tengah
                doc.setFontSize(7);
                doc.setTextColor(180, 180, 180);
                doc.text('No. Sertifikat: ' + certNumber, cx, H - 6, { align: 'center' });

                const safeName = (currentUser.name || 'Peserta').replace(/\s+/g, '_');
                const safeCourse = course.title.replace(/\s+/g, '_');
                doc.save('Sertifikat_' + safeName + '_' + safeCourse + '.pdf');

            } catch (err) {
                console.error('Certificate error:', err);
                alert('Gagal membuat sertifikat: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Download Sertifikat PDF (A4)";
            }
        };
    });
}

        .from('practical_scores')

    const allRows = [];

}

async function renderEditCourseJson() {
    await loadCourses();
    let html = `<div class="card"><h2>📁 Edit Kursus via JSON (Upload File Langsung)</h2>
        <div class="alert-success"><strong>🎯 CARA UPLOAD:</strong><br>1️⃣ Download Template JSON<br>2️⃣ Edit file di komputer<br>3️⃣ Upload file JSON<br>4️⃣ Validasi JSON<br>5️⃣ Simpan ke Database</div>
        <div class="form-group"><label>📚 Pilih Kursus:</label><select id="courseSelect"><option value="">-- Buat Kursus Baru --</option>${coursesData.map(c => `<option value="${c.id}">${c.icon || '📚'} ${c.title} - ${(c.lessons || []).length} materi</option>`).join('')}</select></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;"><button id="downloadTemplateBtn" class="btn-success">📥 Download Template JSON (30 Materi)</button>
        <button id="uploadJsonBtn" class="btn-primary">📤 Upload File JSON</button><button id="loadCourseBtn" class="btn-info">📖 Load Kursus</button>
        <button id="downloadJsonBtn" class="btn-success" disabled>📥 Download JSON</button><input type="file" id="jsonFileInput" accept=".json" style="display:none;"></div>
        <div class="form-group"><label>📝 JSON Editor:</label><textarea id="jsonEditor" rows="15" style="width:100%; font-family:monospace; font-size:11px; background:#1e1e2e; color:#e0e0e0;"></textarea></div>
        <div style="display:flex; gap:10px;"><button id="saveJsonBtn" class="btn-success" disabled>💾 Simpan</button><button id="validateJsonBtn" class="btn-primary">✅ Validasi</button><button id="backBtn" class="btn-back">Kembali</button></div>
        <div id="jsonStatus"></div></div>`;
    document.getElementById("adminContent").innerHTML = html;
    
    const courseSelect = document.getElementById("courseSelect"), jsonEditor = document.getElementById("jsonEditor");
    const loadCourseBtn = document.getElementById("loadCourseBtn"), downloadJsonBtn = document.getElementById("downloadJsonBtn");
    const uploadJsonBtn = document.getElementById("uploadJsonBtn"), saveJsonBtn = document.getElementById("saveJsonBtn");
    const validateJsonBtn = document.getElementById("validateJsonBtn"), backBtn = document.getElementById("backBtn");
    const downloadTemplateBtn = document.getElementById("downloadTemplateBtn"), jsonFileInput = document.getElementById("jsonFileInput");
    const statusDiv = document.getElementById("jsonStatus");
    function setStatus(msg, type) { statusDiv.innerHTML = `<div class="alert-${type}">${msg}</div>`; setTimeout(() => { if(statusDiv.innerHTML.includes(msg)) statusDiv.innerHTML = ""; }, 5000); }
    
    downloadTemplateBtn.onclick = () => {
        let template = { id: null, title: "Nama Kursus Anda", icon: "📚", description: "Deskripsi kursus", price: 200000, telegram_group: "https://t.me/namagrup", lessons: [] };
        for (let i = 1; i <= 30; i++) template.lessons.push({ number: i, title: `Pertemuan ${i}: [Isi Judul Materi]`, videoUrl: "", content: "", quiz: [] });
        let blob = new Blob([JSON.stringify(template, null, 2)], { type: "application/json" });
        let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "template_kursus_30_materi.json"; a.click(); URL.revokeObjectURL(blob);
        setStatus("✅ Template 30 materi berhasil didownload!", "success");
    };
    uploadJsonBtn.onclick = () => jsonFileInput.click();
    jsonFileInput.onchange = async (e) => {
        let file = e.target.files[0]; if (!file) return;
        let reader = new FileReader();
        reader.onload = async (ev) => {
            try { let jsonData = JSON.parse(ev.target.result); jsonEditor.value = JSON.stringify(jsonData, null, 2); setStatus(`✅ File "${file.name}" berhasil diupload!`, "success"); saveJsonBtn.disabled = false; downloadJsonBtn.disabled = false;
            if (jsonData.id) { let opt = Array.from(courseSelect.options).find(o => o.value == jsonData.id); if (opt) courseSelect.value = jsonData.id; }
            } catch (err) { setStatus(`❌ Gagal parsing JSON: ${err.message}`, "danger"); }
        }; reader.readAsText(file); jsonFileInput.value = "";
    };
    loadCourseBtn.onclick = async () => {
        let courseId = courseSelect.value; if (!courseId) { setStatus("Pilih kursus!", "warning"); return; }
        let course = coursesData.find(c => c.id == courseId);
        if (course) { jsonEditor.value = JSON.stringify(course, null, 2); downloadJsonBtn.disabled = false; saveJsonBtn.disabled = false; setStatus(`✅ Kursus "${course.title}" dimuat`, "success"); }
        else setStatus("Gagal memuat", "danger");
    };
    downloadJsonBtn.onclick = () => { try { let json = JSON.parse(jsonEditor.value); let fileName = `course_${json.id || Date.now()}.json`; let blob = new Blob([JSON.stringify(json, null, 2)], { type: "application/json" }); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click(); URL.revokeObjectURL(blob); setStatus(`✅ File "${fileName}" didownload`, "success"); } catch(e) { setStatus(`JSON tidak valid: ${e.message}`, "danger"); } };
    validateJsonBtn.onclick = () => { try { let course = JSON.parse(jsonEditor.value); let errors = []; if (!course.title) errors.push("❌ Tidak ada 'title'"); if (!course.lessons || !Array.isArray(course.lessons)) errors.push("❌ 'lessons' harus array"); if (errors.length) setStatus(errors.join("<br>"), "danger"); else setStatus(`✅ JSON VALID! ${course.lessons?.length || 0} materi`, "success"); } catch(e) { setStatus(`❌ JSON tidak valid: ${e.message}`, "danger"); } };
    saveJsonBtn.onclick = async () => { try { let course = JSON.parse(jsonEditor.value); if (!course.id) { let maxId = Math.max(...coursesData.map(c => c.id), 0); course.id = maxId + 1; } if (!course.lessons) course.lessons = []; if (!confirm(`Simpan ${course.lessons.length} materi ke "${course.title}"?`)) return; if (await saveCourseToDB(course)) { setStatus(`✅ BERHASIL! ${course.lessons.length} materi disimpan`, "success"); await loadCourses(); location.reload(); } } catch(e) { setStatus(`❌ Gagal: ${e.message}`, "danger"); } };
    backBtn.onclick = () => renderAdminDashboard();
}

async function loadPracticalScoresList() {
    const container = document.getElementById("practicalList");
    if (!container) return;
    
    try {
        // Ambil data nilai praktik
        const { data: scores, error } = await supabaseClient
            .from('practical_scores')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) {
            console.error("Error:", error);
            container.innerHTML = '<div class="alert-danger">Gagal memuat data: ' + error.message + '</div>';
            return;
        }
        
        if (!scores || scores.length === 0) {
            container.innerHTML = '<div class="alert-info">Belum ada nilai praktik.</div>';
            return;
        }
        
        let html = `
            <table class="report-table">
                <thead>
                    <tr style="background:#1e6b3b; color:white;">
                        <th>Peserta</th>
                        <th>Kursus</th>
                        <th>Materi</th>
                        <th>Nilai</th>
                        <th>Catatan</th>
                        <th>Tanggal</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        for (const s of scores) {
            // Ambil nama user
            let userName = s.user_id;
            const { data: userData } = await supabaseClient
                .from('profiles')
                .select('full_name')
                .eq('user_id', s.user_id)
                .single();
            
            if (userData && userData.full_name) {
                userName = userData.full_name;
            }
            
            const course = coursesData.find(c => c.id === s.course_id);
            const lesson = course?.lessons[s.lesson_id];
            const courseTitle = course?.title || '-';
            const lessonTitle = lesson?.title || `Materi ${(s.lesson_id || 0) + 1}`;
            
            html += `
                <tr>
                    <td>${escapeHtml(userName)}</td>
                    <td>${escapeHtml(courseTitle)}</td>
                    <td>${escapeHtml(lessonTitle)}</td>
                    <td style="color:${s.score >= 70 ? '#27ae60' : '#e74c3c'}; font-weight:bold;">${s.score}/100</td>
                    <td>${escapeHtml(s.notes || '-')}</td>
                    <td>${new Date(s.created_at).toLocaleDateString('id-ID')}</td>
                </tr>
            `;
        }
        
        html += `</tbody></table>`;
        container.innerHTML = html;
        
    } catch (err) {
        console.error("Error:", err);
        container.innerHTML = '<div class="alert-danger">Error: ' + err.message + '</div>';
    }
}

async function renderPPOBMarkupSettings() {
    let html = `<div class="card"><h2>Pengaturan Markup PPOB</h2><div class="alert-info">Atur markup (keuntungan) untuk setiap produk PPOB.</div>
        <form id="markupForm"><table class="report-table"><thead><tr><th>Kategori</th><th>Produk</th><th>Harga Dasar</th><th>Markup (Rp)</th><th>Harga Jual</th></tr></thead>
        <tbody>${Object.entries(PPOB_PRODUCTS).map(([cat, products]) => products.map(p => `<tr><td>${cat}</td><td>${p.name}</td><td>${formatRupiah(p.basePrice)}</td>
        <td><input type="number" name="markup_${cat}_${p.sku}" value="${p.markup}" min="0" step="500" style="width:100px;"></td>
        <td class="price_${cat}_${p.sku}">${formatRupiah(p.basePrice + p.markup)}</td></tr>`).join('')).join('')}</tbody></table>
        <button type="submit" class="btn-success">Simpan Semua Markup</button><button type="button" id="backBtn" class="btn-back">Kembali</button></form></div>`;
    document.getElementById("adminContent").innerHTML = html;
    Object.entries(PPOB_PRODUCTS).forEach(([cat, products]) => { products.forEach(p => { let inp = document.querySelector(`input[name="markup_${cat}_${p.sku}"]`); if(inp) inp.addEventListener('input', (e) => { let markup = parseInt(e.target.value) || 0; let span = document.querySelector(`.price_${cat}_${p.sku}`); if(span) span.innerHTML = formatRupiah(p.basePrice + markup); }); }); });
    document.getElementById("backBtn").onclick = () => renderAdminDashboard();
    document.getElementById("markupForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = "Menyimpan...";
        try {
            let updated = false;
            const upsertData = [];
            Object.entries(PPOB_PRODUCTS).forEach(([cat, products]) => {
                products.forEach(p => {
                    let inp = document.querySelector(`input[name="markup_${cat}_${p.sku}"]`);
                    if (inp) {
                        let newMarkup = parseInt(inp.value);
                        if (!isNaN(newMarkup) && newMarkup !== p.markup) {
                            p.markup = newMarkup;
                            updated = true;
                        }
                        // Selalu simpan semua markup ke DB (bukan hanya yang berubah)
                        upsertData.push({ key: `ppob_markup_${cat}_${p.sku}`, value: String(p.markup) });
                    }
                });
            });
            if (updated) {
                // Simpan ke Supabase app_settings
                const { error } = await supabaseClient.from('app_settings')
                    .upsert(upsertData, { onConflict: 'key' });
                if (error) throw error;
                alert("✅ Markup PPOB berhasil disimpan ke database!");
            } else {
                alert("Tidak ada perubahan markup.");
            }
            renderPPOBMarkupSettings();
        } catch (err) {
            alert("❌ Gagal menyimpan: " + err.message);
        } finally {
            btn.disabled = false; btn.textContent = "Simpan Semua Markup";
        }
    };
}

// Helper: Build preview HTML sesuai tampilan user

function buildLessonPreviewHtml(title, videoUrl, content, quizRaw) {
    let html = '';

    // Badge preview
    html += `<div style="background:#3498db; color:white; font-size:0.7rem; padding:3px 10px; border-radius:20px; display:inline-block; margin-bottom:10px;">Tampilan di halaman user</div>`;

    // Judul
    html += `<h3 style="margin:8px 0 12px;">${title ? escapeHtml(title) : '<span style="color:#ccc;">Judul materi...</span>'}</h3>`;

    // Video
    const embedUrl = getEmbedUrl(videoUrl);
    if (embedUrl) {
        html += `<div class="video-wrapper"><iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe></div>`;
    }

    // Konten teks
    if (content) {
        const isPlainText = !/<[a-z][\s\S]*>/i.test(content);
        if (isPlainText) {
            html += `<div class="lesson-content" style="line-height:1.8; margin:12px 0; white-space:pre-wrap;">${escapeHtml(content)}</div>`;
        } else {
            html += `<div class="lesson-content" style="line-height:1.8; margin:12px 0;">${content}</div>`;
        }
    }

    // Kosong
    if (!embedUrl && !content) {
        html += `<div class="alert-info">📖 Materi akan segera ditambahkan oleh instruktur.</div>`;
    }

    // Quiz preview
    let quiz = [];
    try { quiz = JSON.parse(quizRaw || "[]"); } catch(e) {}
    if (quiz.length > 0) {
        html += `<hr style="margin:15px 0; border-color:#ddd;">`;
        html += `<div style="font-weight:bold; margin-bottom:10px;">📝 Quiz (${quiz.length} soal)</div>`;
        quiz.forEach((q, i) => {
            html += `<div style="background:#fff; border:1px solid #e0e0e0; border-radius:10px; padding:10px 12px; margin-bottom:8px;">
                <div style="font-weight:600; margin-bottom:6px;">${i+1}. ${escapeHtml(q.q || '')}</div>
                <div style="display:flex; flex-direction:column; gap:4px;">
                    ${(q.opt || []).map((o, oi) => `
                        <div style="padding:5px 10px; border-radius:6px; font-size:0.9rem;
                            background:${oi === q.jawab ? '#e8f8ee' : '#f5f5f5'};
                            color:${oi === q.jawab ? '#27ae60' : '#333'};
                            border:1px solid ${oi === q.jawab ? '#27ae60' : '#e0e0e0'};">
                            ${oi === q.jawab ? '✅' : '○'} ${escapeHtml(o)}
                        </div>`).join('')}
                </div>
            </div>`;
        });
        html += `<div style="font-size:0.75rem; color:#888;">* Jawaban benar ditandai ✅ (hanya tampil di preview ini, tidak ke user)</div>`;
    }

    // Tombol aksi (non-fungsional, hanya visual)
    html += `<div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; opacity:0.6; pointer-events:none;">
        <button class="btn-success" style="font-size:0.85rem;">✅ Tandai Selesai</button>
        ${quiz.length > 0 ? '<button class="btn-primary" style="font-size:0.85rem;">📝 Kerjakan Quiz</button>' : ''}
        <button class="btn-back" style="font-size:0.85rem;">Kembali</button>
    </div>`;

    return html;
}

async function renderSalesReport() {
    // Ambil data penjualan dari tabel sales_transactions
    let { data: sales, error: salesError } = await supabaseClient
        .from('sales_transactions')
        .select('*')
        .order('created_at', { ascending: false });
    
    // Jika tabel kosong, ambil dari data pembelian di profiles
    if (!sales || sales.length === 0) {
        // Hitung manual dari data yang ada
        const { data: profiles } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('status', 'approved');
        
        let manualSales = [];
        let totalRevenue = 0;
        
        for (const p of profiles || []) {
            if (p.purchased_courses && p.purchased_courses.length > 0) {
                for (const courseId of p.purchased_courses) {
                    const course = coursesData.find(c => c.id === courseId);
                    if (course) {
                        let amount = p.is_bundle ? 800000 : course.price;
                        if (p.price_paid) amount = p.price_paid;
                        
                        manualSales.push({
                            user_name: p.full_name,
                            course_title: course.title,
                            amount: amount,
                            created_at: p.created_at || new Date().toISOString()
                        });
                        totalRevenue += amount;
                    }
                }
            }
        }
        
        sales = manualSales;
        totalRevenue = totalRevenue;
    } else {
        totalRevenue = sales.reduce((sum, s) => sum + (s.final_amount || s.amount), 0);
    }
    
    // Hitung statistik
    let totalTransactions = sales?.length || 0;
    let averageTransaction = totalTransactions > 0 ? totalRevenue / totalTransactions : 0;
    
    // Hitung transaksi per bulan
    let monthlyData = {};
    for (const s of sales || []) {
        let month = new Date(s.created_at).toLocaleDateString('id-ID', { year: 'numeric', month: 'long' });
        if (!monthlyData[month]) monthlyData[month] = { count: 0, total: 0 };
        monthlyData[month].count++;
        monthlyData[month].total += (s.final_amount || s.amount);
    }
    
    let html = `
        <div class="card">
            <h2>📊 LAPORAN PENJUALAN</h2>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${totalTransactions}</div><div>Total Transaksi</div></div>
                <div class="stat-card"><div class="stat-number">${formatRupiah(totalRevenue)}</div><div>Total Pendapatan</div></div>
                <div class="stat-card"><div class="stat-number">${formatRupiah(averageTransaction)}</div><div>Rata-Rata Transaksi</div></div>
            </div>
        </div>
        
        <div class="card">
            <h2>📈 PENJUALAN PER BULAN</h2>
            <table class="report-table">
                <thead><tr style="background:#1e6b3b; color:white;"><th>Bulan</th><th>Jumlah Transaksi</th><th>Total Pendapatan</th></tr></thead>
                <tbody>
                    ${Object.entries(monthlyData).map(([month, data]) => `
                        <tr><td>${month}</td><td>${data.count}</td><td>${formatRupiah(data.total)}</td></tr>
                    `).join('') || '<tr><td colspan="3">Belum ada data</td></tr>'}
                </tbody>
            </table>
        </div>
        
        <div class="card">
            <h2>📋 DETAIL TRANSAKSI</h2>
            <div style="overflow-x:auto;">
                <table class="report-table">
                    <thead><tr style="background:#1e6b3b; color:white;">
                        <th>Tanggal</th><th>Pembeli</th><th>Kursus</th><th>Jumlah</th>
                    </tr></thead>
                    <tbody>
                        ${(sales || []).map(s => `
                            <tr>
                                <td>${new Date(s.created_at).toLocaleDateString('id-ID')}</td>
                                <td>${s.user_name || '-'}</td>
                                <td>${s.course_title || '-'}</td>
                                <td>${formatRupiah(s.final_amount || s.amount)}</td>
                            </tr>
                        `).join('') || '<tr><td colspan="4">Belum ada transaksi</td></tr>'}
                    </tbody>
                </table>
            </div>
            <button id="exportSalesBtn" class="btn-success" style="margin-top:15px;">📥 Export CSV</button>
            <button id="backBtn" class="btn-back">Kembali</button>
        </div>
    `;
    
    document.getElementById("adminContent").innerHTML = html;
    
    document.getElementById("backBtn").onclick = () => renderAdminDashboard();
    
    document.getElementById("exportSalesBtn").onclick = () => {
        let csvRows = [["Tanggal", "Pembeli", "Kursus", "Jumlah"]];
        for (const s of sales || []) {
            csvRows.push([
                new Date(s.created_at).toLocaleDateString('id-ID'),
                s.user_name || '-',
                s.course_title || '-',
                s.final_amount || s.amount
            ]);
        }
        let csvContent = csvRows.map(row => row.join(",")).join("\n");
        let blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv" });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `laporan_penjualan_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        alert("✅ Laporan penjualan diexport!");
    };
}

const RESELLER_LEVELS = [
    { name: 'BASIC',    min: 0,    max: 49,       pct: 20 },
    { name: 'BRONZE',   min: 50,   max: 99,       pct: 25 },
    { name: 'SILVER',   min: 100,  max: 499,      pct: 30 },
    { name: 'GOLD',     min: 500,  max: 999,      pct: 35 },
    { name: 'PLATINUM', min: 1000, max: 4999,     pct: 40 },
    { name: 'DIAMOND',  min: 5000, max: Infinity, pct: 50 }
];
const MIN_COMMISSION_PAYOUT = 50000;

function getResellerLevel(count) {
    let idx = 0;
    RESELLER_LEVELS.forEach((l, i) => { if (count >= l.min) idx = i; });
    const cur = RESELLER_LEVELS[idx], next = RESELLER_LEVELS[idx + 1] || null;
    return { cur, next, remaining: next ? next.min - count : 0 };
}

        const name = document.getElementById("payoutName").value.trim();
        const { error } = await supabaseClient.from('withdraw_requests').insert({
            user_id: currentUser.id, amount, type: 'commission', bank_name: bank, bank_account: acc,
            notes: `Nama: ${name}`, status: 'pending'
        });
        if (error) { alert("❌ Gagal: " + error.message); return; }
        alert("✅ Pengajuan pencairan komisi terkirim. Admin akan mentransfer ke rekening Anda.");
        renderResellerInfo();
    };
}
// ======================== ROUTING ========================
async function route() {
    let hash = window.location.hash.slice(1);
    if (!supabaseClient) { showLoading(); let success = await initSupabase(); if (!success) return; }
    if (hash === "" || hash === "landing") renderLandingPage();
    else if (hash === "register") renderRegisterForm(false);
    else if (hash === "register-bundle") renderRegisterForm(true);
    else if (hash === "login") renderLoginForm();
    else if (hash === "forgot-password") renderForgotPassword();
    else if (hash === "dashboard") { if (currentUser) renderUserDashboard(); else window.location.hash = "#login"; }
    else if (hash === "admin") renderAdminLogin();
    else if (hash === "admin-dashboard") { if (isAdmin) renderAdminDashboard(); else { alert("Akses ditolak"); window.location.hash = "#landing"; } }
    else {
        // Cek jika ada ?ref= di URL tanpa hash, arahkan ke register
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('ref')) { renderRegisterForm(false); }
        else renderLandingPage();
    }
}

// ======================== CACHE UTILITIES ========================
async function clearAppCache() {
    await CacheDB.clear();
    alert('✅ Cache berhasil dihapus! Halaman akan dimuat ulang.');
    location.reload();
}

// Tampilkan info cache di console
async function checkCacheStatus() {
    const courses = await CacheDB.get('courses');
    const badges = await CacheDB.get('badges');
    const profile = currentUser ? await CacheDB.get('profile_' + currentUser.id) : null;
    console.log('📦 Cache status:', {
        courses: courses ? `✅ ${courses.length} kursus` : '❌ kosong',
        badges: badges ? `✅ ${badges.length} badge` : '❌ kosong',
        profile: profile ? '✅ ada' : '❌ kosong'
    });
}

// ======================== INIT ========================
window.addEventListener("hashchange", route);
let saved = localStorage.getItem("darkMode");
if (saved === "true") document.documentElement.setAttribute("data-theme", "dark");

// Jika ada ?ref= di URL tanpa hash aktif, set hash ke #register
(function() {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    const hash = window.location.hash.slice(1);
    if (ref && (!hash || hash === '' || hash === 'landing')) {
        window.location.hash = '#register';
    }
})();

route();
</script>
