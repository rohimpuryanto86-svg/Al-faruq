    <script>
    (function () {
        var logs = [], box = null;
        function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
        function render() {
            if (!document.body) { return document.addEventListener('DOMContentLoaded', render); }
            if (!box) {
                box = document.createElement('div');
                box.id = 'dbgBox';
                box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:55%;overflow:auto;background:#1a1a1a;color:#ffb4b4;font:12px/1.4 monospace;padding:10px;z-index:2147483647;border-top:3px solid #e74c3c;white-space:pre-wrap;word-break:break-word;';
                document.body.appendChild(box);
            }
            box.innerHTML = '<div style="color:#fff;font-weight:bold;margin-bottom:6px;">⚠️ Info kesalahan (' + logs.length + ') ' +
                '<button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById(\'dbgText\').innerText).then(function(){alert(\'Tersalin\')})" style="margin-left:8px;">Salin</button>' +
                '<button onclick="document.getElementById(\'dbgBox\').remove()" style="margin-left:6px;">Tutup</button></div>' +
                '<div id="dbgText">' + logs.map(esc).join('\n\n') + '</div>';
        }
        function add(msg) {
            if (logs.length > 25) return;
            logs.push(new Date().toLocaleTimeString() + '  ' + msg);
            render();
        }
